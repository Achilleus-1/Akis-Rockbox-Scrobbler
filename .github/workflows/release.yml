name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  package:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $taskVersion = python -c "from version import VERSION; print(VERSION)"
          if ($env:GITHUB_REF_NAME -ne "v$taskVersion") { throw 'Tag does not match source version' }
      - name: Install build tools
        run: |
          python -m pip install -r requirements-build.txt
          choco upgrade innosetup --version=6.7.3 --yes --no-progress
      - name: Build release assets
        run: |
          python build.py
          python tools/package_release.py
          python tools/build_installer.py
      - name: Verify portable and installed apps without system Python
        shell: pwsh
        run: |
          $taskTarget = Join-Path $env:RUNNER_TEMP 'Scrobbler install test'
          $taskSetup = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
          $taskProcess = Start-Process -FilePath $taskSetup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="'+$taskTarget+'"') -WindowStyle Hidden -Wait -PassThru
          if ($taskProcess.ExitCode -ne 0) { throw 'Installer failed' }
          $taskOriginalPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            foreach ($taskExe in @((Join-Path $pwd 'dist\Akis-Rockbox-Scrobbler\Akis-Rockbox-Scrobbler.exe'), (Join-Path $taskTarget 'Akis-Rockbox-Scrobbler.exe'))) {
              $taskReport = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString()+'.json')
              $taskCheck = Start-Process -FilePath $taskExe -ArgumentList '--smoke-test',('"'+$taskReport+'"') -WindowStyle Hidden -Wait -PassThru
              if ($taskCheck.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $taskReport)) { throw 'Native app smoke test failed' }
              $taskResult = Get-Content -LiteralPath $taskReport -Raw | ConvertFrom-Json
              if (-not $taskResult.ok -or -not $taskResult.frozen) { throw 'Bundled runtime check failed' }
            }
          } finally { $env:PATH = $taskOriginalPath }
          $taskShortcut = Join-Path ([Environment]::GetFolderPath('StartMenu')) "Programs\Aki's Rockbox Scrobbler\Aki's Rockbox Scrobbler.lnk"
          if (-not (Test-Path -LiteralPath $taskShortcut)) { throw 'Start menu shortcut missing' }
          $taskData = Join-Path $env:LOCALAPPDATA 'RockboxRelay'
          New-Item -ItemType Directory -Force -Path $taskData | Out-Null
          $taskSentinel = Join-Path $taskData 'uninstall-preservation-test.txt'
          Set-Content -LiteralPath $taskSentinel -Value 'Preserve user data'
          $taskUninstall = Start-Process -FilePath (Join-Path $taskTarget 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($taskUninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (-not (Test-Path -LiteralPath $taskSentinel)) { throw 'Uninstall removed user data' }
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskVersion = python -c "from version import VERSION; print(VERSION)"
          $taskAssets = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @taskAssets --repo $env:GITHUB_REPOSITORY --verify-tag --title "Aki's Rockbox Scrobbler $taskVersion" --notes-file "docs/releases/$taskVersion.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
