name: Bug report
description: Report a reproducible problem with the app.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Do not include API keys, shared secrets, launch/session tokens, or private listening logs. Use the security policy for vulnerabilities."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, Python and browser versions
      placeholder: "Windows 11, Python 3.12, Firefox"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the relevant settings and a small synthetic log if helpful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and exact error
      description: Remove personal data and credentials before adding screenshots.
    validations:
      required: true
